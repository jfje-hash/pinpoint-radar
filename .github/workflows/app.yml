name: 앱 만들기
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
    
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: APK 빌드
        run: bash android-app.sh
      - name: 휴대폰에서 받을 수 있게 올리기
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete app --yes --cleanup-tag || true
          gh release create app pinpoint-radar.apk --target "$GITHUB_SHA" --title "핀포인트 레이더 앱" --notes "휴대폰에서 아래 pinpoint-radar.apk를 눌러 받은 뒤 설치하세요."
